<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedKit - Login Laboratorial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="frontend/css/style.css">
    <link rel="icon" type="image/png" href="frontend/img/logo.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medred: { 500: '#D32F2F', 600: '#B71C1C' },
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="flex justify-center mb-4">
            <img src="frontend/assets/logo.png" alt="Logo MedKit" class="w-52 h-36 object-contain">
        </div>
        <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">MedKit</h2>
        <p class="text-center text-gray-500 mb-8">Acesso restrito para laboratório</p>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="crm">CRM / Usuário</label>
                <input class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-medred-500" id="crm" type="text" placeholder="Ex: CRM-SP 123456" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Senha</label>
                <input class="shadow-sm appearance-none border rounded-lg w-full py-3 px-4 text-gray-700 mb-3 leading-tight focus:outline-none focus:ring-2 focus:ring-medred-500" id="password" type="password" placeholder="******************" required>
            </div>
            
            <!-- Mensagem de erro dinâmica -->
            <div id="login-error" class="hidden-view bg-red-50 border border-red-200 text-red-600 text-sm p-3 rounded-lg mb-4 text-center">
                CRM ou senha inválidos.
            </div>

            <button id="btn-login" class="w-full bg-medred-500 hover:bg-medred-600 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-200 flex items-center justify-center gap-2" type="submit">
                <span>Entrar no Sistema</span>
            </button>
        </form>
    </div>

    <script src="frontend/js/login.js"></script>
</body>
</html>
